; PHP limits for the support relay (cPanel PHP-FPM reads .user.ini from the document root).
; Screenshot ≤ 5 MB + form fields; ticket.php rejects bodies > 6 MB itself.
upload_max_filesize = 6M
post_max_size = 7M
max_file_uploads = 2
display_errors = Off
expose_php = Off
; CVE-2026-115560: session upload progress is an RCE path on unpatched PHP.
session.upload_progress.enabled = Off
