name: Security scan

# Looks for security holes automatically — on every push to main, every Monday
# morning, and on demand (Actions → Security scan → Run workflow).
#
# 1. audit:   known holes in the PHP libraries we use (composer). Any hole
#             turns the run red and GitHub emails the pusher. The fix usually
#             arrives as a Dependabot pull request (.github/dependabot.yml).
# 2. semgrep: mistakes in our own PHP — user input reaching HTML, SQL, shell,
#             files or redirects. Findings go to the repo's Security → Code
#             scanning tab, which emails admins and tracks each one until it is
#             fixed or dismissed with a reason. Our own rules: .semgrep/.
#
# Runs only in ngo-cms itself. Sites built on it (lafetki, other NGOs) receive
# this file with each release, but their code is this code, already scanned
# here — and uploading results needs code scanning, which private repos lack.
# (npm isn't audited: package.json has only test tools, nothing ships.)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'linnah08/ngo-cms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, pdo_mysql, mbstring, intl, gd, curl

      - name: Install dependencies
        # GitHub sometimes refuses downloads with 429 (too many requests);
        # wait and try again instead of failing the run.
        run: |
          for i in 1 2 3 4; do
            composer install --no-interaction --no-progress && exit 0
            [ "$i" -lt 4 ] || break
            echo "::warning::composer install failed (try $i of 4), retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1

      - name: Known holes in PHP libraries
        run: composer audit

  semgrep:
    if: github.repository == 'linnah08/ngo-cms'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep==1.187.0

      - name: Our own rules still catch what they should
        run: semgrep --test --config .semgrep/ngo-cms.yml .semgrep/ngo-cms.php

      # Two stock rules are switched off because they can't be taught our
      # conventions and only produced false alarms:
      # - echoed-request doesn't know our h() escaper; our own
      #   ngo-cms-unescaped-request-output rule covers the same hole and does.
      # - tainted-callable flags every $pdo->prepare("... IN ($placeholders)").
      - name: Scan our code
        run: >-
          semgrep scan --metrics=off
          --config p/php --config p/security-audit --config .semgrep/ngo-cms.yml
          --exclude-rule php.lang.security.injection.echoed-request.echoed-request
          --exclude-rule php.lang.security.injection.tainted-callable.tainted-callable
          --sarif --output semgrep.sarif

      # Findings marked "// nosemgrep: <rule> — <why>" were checked and are
      # safe, but Semgrep still lists them (as suppressed) and GitHub would
      # open an alert for each. Keep only the unreviewed ones.
      - name: Leave out reviewed false alarms
        if: always()
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif

      - name: Send findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
