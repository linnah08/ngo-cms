name: Build release ZIP

# Builds a ready-to-upload package (application + vendor/) so non-technical
# users can install without git or composer: download the ZIP, upload it to
# their hosting's File Manager, extract, and open the site to run the wizard.
#
# Before anything is published, the release gate installs the PREVIOUS release,
# updates it to this ZIP with the site's own updater, and checks the site still
# loads — as a fresh install and as a fork that keeps its own config.php (the
# case that took a site down with v0.17.0). If the gate fails, no release asset
# is published. Run the same gate locally with tests/release-gate/gate.sh.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # The gate installs real sites, so it needs a real database — the same
    # engine production runs.
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: release-gate
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prelease-gate"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, pdo_mysql, mbstring, intl, gd, curl

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Stamp VERSION
        run: |
          REF="${GITHUB_REF_NAME:-}"
          if [[ "$REF" == v* ]]; then
            VER="${REF#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "$VER" > VERSION
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Stamped VERSION: $VER"

      - name: Build ZIP
        run: |
          ZIP="ngo-platform-${GITHUB_REF_NAME:-manual}.zip"
          bash tests/release-gate/build-zip.sh "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Release gate (update the previous release to this one)
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_GH_REPO: ${{ github.repository }}
          GATE_DB_HOST: 127.0.0.1
          GATE_DB_USER: root
          GATE_DB_PASS: release-gate
        run: |
          # A manual build is 0.0.0-dev, which no site would update to; gate it
          # as a version above every published one.
          GATE_VER="$VER"
          if [[ "$VER" == "0.0.0-dev" ]]; then GATE_VER="99.0.0"; fi
          bash tests/release-gate/gate.sh --new-zip "$ZIP" --version "$GATE_VER"

      - name: Attach to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Пакет за първоначална инсталация: разархивирайте го в папката на домейна си и отворете сайта, за да стартирате инсталатора. Сайт, който вече работи, се обновява сам от Администрация → Обновления." \
          || gh release upload "${GITHUB_REF_NAME}" "${ZIP}" --clobber

      - name: Upload as build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ngo-platform
          path: ${{ env.ZIP }}
