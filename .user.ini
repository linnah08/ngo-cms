log_errors = On
display_errors = Off
error_reporting = E_ALL
error_log = logs/php_errors.log

; Session cookie security — GDPR / OWASP hardening
session.cookie_httponly = On
session.cookie_secure   = On
session.cookie_samesite = Lax

; CVE-2026-115560: session upload progress is an RCE path on unpatched PHP.
; Nothing here uses it — keep it off until PHP ships the fix.
session.upload_progress.enabled = Off
