; Raise upload limits for product image uploads (PHP-FPM)
upload_max_filesize = 8M
post_max_size = 10M

; Always resolve to the project root regardless of vhost DOCUMENT_ROOT setting.
auto_prepend_file = pin-docroot.php

; CVE-2026-115560 — repeated here because some vhosts misreport the document
; root, so the root .user.ini may never be read for admin scripts.
session.upload_progress.enabled = Off
